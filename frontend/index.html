<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoHora</title>
    <link rel="icon" href="assets/Ca105ad9cfc8580c765101d17bbb2323.webp">
    <!-- Adicionado para estilizar icones... Veja mais aqui: https://fonts.google.com/icons?selected=Material+Symbols+Outlined:recycling:FILL@0;wght@400;GRAD@0;opsz@24&icon.query=recy&icon.size=24&icon.color=%23e3e3e3 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- Relação de estilo adicionada in-line para fácil compreensão inicial do estilo aplicado ao redesign e adição da HomePage -->
    <style>
        /* Fonte adicionada para melhor estilização: Veja mais aqui: https://fonts.google.com/specimen/Archivo+Black?selected=Material+Symbols+Outlined:recycling:FILL@0;wght@400;GRAD@0;opsz@24&icon.size=24&icon.color=%23e3e3e3&preview.script=Latn */
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap');
        /* Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            text-decoration: none;
        }

        body {
            background-color: #071f1c;
        }
        
        /* Mobile First */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgb(7, 31, 28);
            padding: 0.7rem 1.7rem;
        }

        #header-brand {
            display: flex; align-items: center;
        }

        #brand-text {
            font-size: 1.5rem; font-weight: bold;
        }

        #brand-image {
            width: 2rem;
        }

        /* Botão do menu */
        .hamburguer-menu {
            margin-right: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;     
            gap: 0.3rem;
            background-color: transparent;
            border: none;
            cursor: pointer;
            width: 2rem;
            height: 2rem;
            position: relative;
        }

        /* Estado base das barras */
        .hamburguer-menu-bar {
            background-color: white;
            height: 0.2rem;
            width: 1.7rem;
            transition: all 0.3s ease;
            transform-origin: center;
        }

        /* Coloca tudo no centro */
        .hamburguer-menu.active .hamburguer-menu-bar {
            position: absolute; 
            margin: 0;
        }

        /* Gira a barra de cima */
        .hamburguer-menu.active #hmb1 {
            background-color: rgb(168, 62, 62);
            rotate: 45deg;
        }

        /* Some coma barra do meio, opacity pra sair de fininho */
        .hamburguer-menu.active #hmb2 {
            opacity: 0;
        }
        
        /* Gira a barra de baixo */
        .hamburguer-menu.active #hmb3 {
            background-color: rgb(168, 62, 62);
            rotate: -45deg;
        }

        #access-site-button {
            font-size: 1rem;
            background-color: transparent;
            border: solid 1px #7be3a8;
            border-radius: 2rem;
            padding: 0.6rem 1rem;
            cursor: pointer;
        }

        #access-site-button:hover{
            background-color: #0b3f39;
        }

        #meet-the-project {
            font-size: 1rem;
            background-color: transparent;
            border-radius: 2rem;
            padding: 0.6rem 1rem;
            border: solid 1px rgb(47, 224, 255);
            cursor: pointer;
        }

        #meet-the-project:hover {
            background-color: #0b3f39;
        }

        #header-buttons {
            display: flex;
            gap: 1rem;
            display: none;
        }

        #invitation-banner {
            background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.7) 80%, rgb(7, 31, 28) 100%), url('assets/faeng22.jpg');
            background-repeat: no-repeat, no-repeat;
            background-position: top, 40%; 
            background-size: cover;
            background-color: rgb(7, 31, 28);
            height: calc(100dvh - 3.4rem);
        }

        /* Funcionamento para as coisas a partir de 415px -> DESKTOP */
        @media (min-width: 415px) {
            #brand-text {
                font-size: 2rem;
            }

            #brand-image {
                width: 2.5rem;
            }

            .hamburguer-menu {
                display: none;
            }

            #header-buttons{
                display: inherit;
            }

            #invitation-banner {
                background-position: top, left 90%; 
                height: calc(100dvh - 3.9rem);
            }

        }

    </style>
</head>

<body>
    <!-- Cabeçalho -->
    <header>
        <a href="#">
            <div id="header-brand">
                <p id="brand-text"><span style="color: #29c777;">Eco</span><span style="color: #7be3a8;">Hora</span></p>
                <img id="brand-image" src="assets/Ca105ad9cfc8580c765101d17bbb2323.webp" alt="Logo EcoHora">
            </div>
        </a>

        <div id="header-buttons">
            <button id="access-site-button" onclick="redirectToLogin()">
                <p>Entrar no site</p>
            </button>
            <button id="meet-the-project" onclick="redirectToExplanation()">
                <p>Conhecer o projeto</p>
            </button>
        </div>
        
        <!-- Menu de hamburguer deve sumir quando for em desktop -->
        <button class="hamburguer-menu" onclick="activateHamburguerMenu()">
            <span class="hamburguer-menu-bar" id="hmb1"></span>
            <span class="hamburguer-menu-bar" id="hmb2"></span>
            <span class="hamburguer-menu-bar" id="hmb3"></span>
        </button>
    </header>

    <!-- Corpo principal -->
    <main>
        <div id="invitation-banner">
            <h1>SÓ AQUI</h1>
            <p><span id="banner-dinamic-text">Seu caderno</span></p>
            <p>vale horas complementares</p>
        </div>

        <div id="deminonstrations">
            akljsda
        </div>
    </main>

    <script>
        function activateHamburguerMenu() {
                const hamburgerMenu = document.querySelector(".hamburguer-menu");
                hamburgerMenu.classList.toggle("active");
        }

        function redirectToLogin(){
            window.location.href = "login.html";
        }
        
        function redirectToExplanation(){
            window.location.href = "#deminonstrations";
        }

        // Texto dinamico para a parte de itens valiosos
        let wordSelected = 0;
        const dinamicWordsList = ["Seu caderno", "Sua embalagem", "Sua latinha", "Sua garrafa"];
        const dinamicWordsArea = document.querySelector("#banner-dinamic-text");

        // Configurações do efeito
        const typingSpeed = 130;   // Velocidade ao digitar (ms por letra)
        const erasingSpeed = 50;   // Velocidade ao apagar (ms por letra)
        const delayBetweenWords = 2500; // Tempo que a palavra fica exposta antes de apagar

        function typeEffect() {
            // Garante que a palavra default seja apagada para aplicar o efeito
            dinamicWordsArea.innerHTML = ""
            let currentWord = dinamicWordsList[wordSelected];
            // Index da letra específica (Area)[0] = A
            let currentCharIndex = 0;

            // Função interna para digitar letra por letra
            function type() {
                if (currentCharIndex < currentWord.length) {
                    // Da pra usar o operador de soma hehehe
                    dinamicWordsArea.innerHTML += currentWord.charAt(currentCharIndex);
                    currentCharIndex++;
                    // Usando as configurações mencionadas acima
                    setTimeout(type, typingSpeed);
                } else {
                    // Palavra terminou de ser digitada. Aguarda e depois apaga.
                    setTimeout(erase, delayBetweenWords);
                }
            }

            // Função interna para apagar letra por letra
            function erase() {
                if (currentCharIndex > 0) {
                    dinamicWordsArea.innerHTML = currentWord.substring(0, currentCharIndex - 1);
                    currentCharIndex--;
                    setTimeout(erase, erasingSpeed);
                } else {
                    // Palavra foi toda apagada. Avança para a próxima na lista.
                    wordSelected++;
                    if (wordSelected >= dinamicWordsList.length) {
                        wordSelected = 0; // Reinicia a lista
                    }
                    // Começa a digitar a nova palavra
                    setTimeout(typeEffect, 300);
                }
            }

            // Inicia o ciclo digitando
            type();
        }

        // Inicia o efeito assim que o script roda
        typeEffect();

    </script>
</body>

</html>
