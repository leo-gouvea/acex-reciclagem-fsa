<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071f1c">
    <title>EcoHora</title>
    <link rel="icon" href="assets/Ca105ad9cfc8580c765101d17bbb2323.webp">
    <!-- Adicionado para estilizar icones... Veja mais aqui: https://fonts.google.com/icons?selected=Material+Symbols+Outlined:recycling:FILL@0;wght@400;GRAD@0;opsz@24&icon.query=recy&icon.size=24&icon.color=%23e3e3e3 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- Manifest é o que torna o site instalável no celular/mobile em geral -->
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Relação de estilo adicionada in-line para fácil compreensão inicial do estilo aplicado ao redesign e adição da HomePage -->
    <style>
        /* Fonte adicionada para melhor estilização: Veja mais aqui: https://fonts.google.com/specimen/Archivo+Black?selected=Material+Symbols+Outlined:recycling:FILL@0;wght@400;GRAD@0;opsz@24&icon.size=24&icon.color=%23e3e3e3&preview.script=Latn */
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap');
        /* Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            text-decoration: none;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #071f1c;
        }
        
        img {
            user-select: none;
            pointer-events: none; 
        }

        /* Mobile First */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #071f1c;
            padding: 0.7rem 1.7rem;
        }

        #header-brand {
            display: flex; align-items: center;
        }

        #brand-text {
            font-size: 1.5rem; font-weight: bold;
        }

        #brand-image {
            width: 2rem;
        }

        /* Botão do menu */
        .hamburguer-menu {
            margin-right: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;     
            gap: 0.3rem;
            background-color: transparent;
            border: none;
            cursor: pointer;
            width: 2rem;
            height: 2rem;
            position: relative;
        }

        /* Estado base das barras */
        .hamburguer-menu-bar {
            background-color: white;
            height: 0.2rem;
            width: 1.7rem;
            transition: all 0.3s ease;
            transform-origin: center;
        }

        /* Coloca tudo no centro */
        .hamburguer-menu.active .hamburguer-menu-bar {
            position: absolute; 
            margin: 0;
        }

        /* Gira a barra de cima */
        .hamburguer-menu.active #hmb1 {
            background-color: rgb(168, 62, 62);
            rotate: 45deg;
        }

        /* Some coma barra do meio, opacity pra sair de fininho */
        .hamburguer-menu.active #hmb2 {
            opacity: 0;
        }
        
        /* Gira a barra de baixo */
        .hamburguer-menu.active #hmb3 {
            background-color: rgb(168, 62, 62);
            rotate: -45deg;
        }

        #access-site-button {
            font-size: 1rem;
            background-color: transparent;
            border: solid 1px #7be3a8;
            border-radius: 1rem;
            padding: 0.6rem 1rem;
            cursor: pointer;
        }

        #access-site-button:hover{
            background-color: #0b3f39;
        }

        #meet-the-project-button {
            font-size: 1rem;
            background-color: transparent;
            border-radius: 1rem;
            padding: 0.6rem 1rem;
            border: solid 1px rgb(47, 224, 255);
            cursor: pointer;
        }

        #meet-the-project-button:hover {
            background-color: #0b3f39;
        }

        #header-buttons {
            gap: 1rem;
            display: none;
        }

        #header-buttons-mobile{
            display: none;
            flex-direction: column;
            gap: 1rem;
            position: absolute;
            top: 3.3rem;
            left: 0;
            background-color: #071f1c;
            padding: 2rem;
            width: 100%;
        }

        #header-buttons-mobile.active{
            display: flex;
        }

        #invitation-banner{
            background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.7) 80%, rgb(7, 31, 28) 100%), url('assets/faeng22.jpg');
            background-repeat: no-repeat, no-repeat;
            background-position: top, 40%; 
            background-size: cover;
            background-color: rgb(7, 31, 28);
            height: calc(100dvh - 3.4rem);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        #invitation-banner #stack1{
            display: flex;
            flex-direction: column;
            text-align: center;
            align-items: center;
            justify-content: center;
            margin-top: 10dvh;
        }

        #invitation-banner h1{
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        #invitation-banner p{
            font-size: 2rem;
        }

        #banner-clock{
            width: 30dvh;
            margin-top: 0.2rem;
            rotate: -90deg;
        }

        #start-to-earn-button{
            width: fit-content;
            margin-bottom: 3rem;
            background-image: linear-gradient(to right, rgb(0, 30, 114), rgb(0, 20, 77));
            border: solid 1px rgb(125, 197, 255);
            padding: 1rem;
            border-radius: 1rem;
        }

        #start-to-earn-button:hover{
            cursor: pointer;
            background-image: linear-gradient(to right, rgb(0, 20, 77), rgb(0, 30, 114));
        }

        #project-presentation{
            padding: 2rem;
        }

        #project-presentation h2{
            font-size: 2rem;
            margin-bottom: 2rem;
        }
        
        #project-presentation p {
            font-size: 1.2rem;
        }

        #back-to-top-button {
            position: fixed;
            bottom: 20px;

            visibility: hidden;
            right: 0px;
            opacity: 0;

            background-color: transparent;
            border: yellow solid 1px;
            border-radius: 1rem;
            font-size: 1rem;
            padding: 1rem;
            transition: all 0.3s ease;
        }

        #back-to-top-button:hover {
            cursor :pointer;
            background-color: rgb(0, 0, 0, 0.1);
        }

        #back-to-top-button.active {
            visibility: visible;
            opacity: 1;
            transform: translateX(-30px);
        }

        /* Funcionamento para as coisas a partir de 415px -> DESKTOP */
        /* Alterado de 415 (Celular médio) para 1025 (1024 é Tablet Premium estilo iPad Pro) */
        @media (min-width: 1025px) {
            #brand-text {
                font-size: 2rem;
            }

            #brand-image {
                width: 2.5rem;
            }

            .hamburguer-menu {
                display: none;
            }

            #header-buttons{
                display: flex;
            }

            #header-buttons-mobile{
                display: none;
            }

            #invitation-banner {
                background-position: top, left 90%; 
                height: calc(100dvh - 3.9rem);
            }
            
            #invitation-banner #stack1 {
                flex-direction: row;
                text-align: left;
                align-items: center;
                justify-content: center;
                margin-top: 15dvh;
            }

            #invitation-banner h1{
                font-size: 12dvh;
                margin-bottom: 1rem;
            }

            #invitation-banner p{
                font-size: 7dvh;
            }

            #banner-clock{
                width: 50dvh;
                margin: 0;
                margin-left: 10rem;
            }

            #start-to-earn-button{
                font-size: 1rem;
            }

            #project-presentation h2{
                font-size: 2.5rem;
            }

        }

        
        /* Animações */
        .simple-float {
            animation: floatUp 2s ease-in-out infinite alternate;
        }

        @keyframes floatUp {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(-20px);
            }
        }

    </style>
</head>

<body id="top">
    <!-- Cabeçalho -->
    <header>
        <a href="#">
            <div id="header-brand">
                <p id="brand-text"><span style="color: #29c777;">Eco</span><span style="color: #7be3a8;">Hora</span></p>
                <img id="brand-image" src="assets/Ca105ad9cfc8580c765101d17bbb2323.webp" alt="Logo EcoHora">
            </div>
        </a>

        <div id="header-buttons">
            <button id="access-site-button" onclick="redirectToLogin()">
                <p>Entrar no site</p>
            </button>
            <button id="meet-the-project-button" onclick="redirectToExplanation()">
                <p>Conhecer o projeto</p>
            </button>
        </div>
        
        <!-- Menu de hamburguer deve sumir quando for em desktop -->
        <button class="hamburguer-menu" onclick="activateHamburguerMenu()">
            <span class="hamburguer-menu-bar" id="hmb1"></span>
            <span class="hamburguer-menu-bar" id="hmb2"></span>
            <span class="hamburguer-menu-bar" id="hmb3"></span>
        </button>

        <!-- Adicionada para a versão Mobile -->
        <div id="header-buttons-mobile">
            <button id="access-site-button" onclick="redirectToLogin()">
                <p>Entrar no site</p>
            </button>
            <button id="meet-the-projectbutton" onclick="redirectToExplanation()">
                <p>Conhecer o projeto</p>
            </button>
        </div>
    </header>

    <!-- Corpo principal -->
    <main>
        <div id="invitation-banner">
            <div id="stack1">
                <div id="banner-text">
                    <h1>SÓ AQUI</h1>
                    <p><span id="banner-dinamic-text" style="color: rgb(255, 153, 0); font-weight: bold;">Seu caderno</span>‎</p>
                    <p>vale <span style="color: rgb(0, 255, 157); font-weight: bold;">horas complementares</span></p>
                </div>
                <img src="assets/icons8-relógio-920.png" alt="Relógio Banner" id="banner-clock" class="simple-float">
            </div>

            <button id="start-to-earn-button" onclick="redirectToLogin()"> Comece a ganhar</button>
        </div>

        <div id="project-presentation">
            <h2>O que é o projeto?</h2>
            <p>Pode dizer qualquer coisa</p>
        </div>

        <button id="back-to-top-button" onclick="redirectToTop()">
            Voltar ao Topo
        </button>
    </main>

    <footer style="margin-top: 5rem;"></footer>

    <script>
        function activateHamburguerMenu() {
                const hamburgerMenu = document.querySelector(".hamburguer-menu");
                hamburgerMenu.classList.toggle("active");

                const buttonsMobile = document.querySelector("#header-buttons-mobile");
                buttonsMobile.classList.toggle("active");
        }


        function redirectToLogin(){
            window.location.href = "login.html";
        }
        

        function redirectToExplanation(){
            const projetPresentation = document.getElementById("project-presentation");
            
            if (projetPresentation) {
                // Executa a rolagem suave nativa via JS. Podia ter sido com window.location.href, ams escolhi essa...
                projetPresentation.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
                
                // Só fecha o menu se o botão hambúrguer estiver visível (evita um bug no PC)
                const hamburgerBtn = document.querySelector('.hamburguer-menu');
                if (hamburgerBtn && window.getComputedStyle(hamburgerBtn).display !== 'none') {
                    activateHamburguerMenu();
                }
            }
        }


        const backToTopButton = document.querySelector("#back-to-top-button");
        window.addEventListener("scroll", () => {
            if (window.scrollY > 300) {
                backToTopButton.classList.add("active");
            } else {
                backToTopButton.classList.remove("active");
            }
        })


        function redirectToTop(){
            const pageTop = document.querySelector("#top");

            if (pageTop) {
                pageTop.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
            }
        }

        // Texto dinamico para a parte de itens valiosos
        let wordSelected = 0;
        const dinamicWordsList = ["Seu caderno", "Sua embalagem", "Sua latinha", "Sua garrafa"];
        const dinamicWordsArea = document.querySelector("#banner-dinamic-text");

        // Configurações do efeito
        const typingSpeed = 130; // Velocidade ao digitar (ms por letra)
        const erasingSpeed = 50; // Velocidade ao apagar (ms por letra)
        const delayBetweenWords = 2500; // Tempo que a palavra fica exposta antes de apagar

        function typeEffect() {
            // Garante que a palavra default seja apagada para aplicar o efeito
            dinamicWordsArea.innerHTML = ""
            let currentWord = dinamicWordsList[wordSelected];
            // Index da letra específica (Area)[0] = A
            let currentCharIndex = 0;

            // Função interna para digitar letra por letra
            function type() {
                if (currentCharIndex < currentWord.length) {
                    // Da pra usar o operador de soma hehehe
                    dinamicWordsArea.innerHTML += currentWord.charAt(currentCharIndex);
                    currentCharIndex++;
                    // Usando as configurações mencionadas acima
                    setTimeout(type, typingSpeed);
                } else {
                    // Palavra terminou de ser digitada. Aguarda e depois apaga.
                    setTimeout(erase, delayBetweenWords);
                }
            }

            // Função interna para apagar letra por letra
            function erase() {
                if (currentCharIndex > 0) {
                    dinamicWordsArea.innerHTML = currentWord.substring(0, currentCharIndex - 1);
                    currentCharIndex--;
                    setTimeout(erase, erasingSpeed);
                } else {
                    // Palavra foi toda apagada. Avança para a próxima na lista.
                    wordSelected++;
                    if (wordSelected >= dinamicWordsList.length) {
                        wordSelected = 0; // Reinicia a lista
                    }
                    // Começa a digitar a nova palavra
                    setTimeout(typeEffect, 300);
                }
            }

            // Inicia o ciclo digitando
            type();
        }

        // Inicia o efeito assim que o script roda
        typeEffect();

    </script>
</body>

</html>
