<script>
    const result = document.getElementById("result");

    function showResult(test, sucesso, data) {
        const status = sucesso ? "✅ PASSOU" : "❌ FALHOU";

        result.textContent = `
# ${status}

Teste: ${test}

Resultado:
${typeof data === "string"
                ? data
                : JSON.stringify(data, null, 2)}
        `.trim();
    }


    // TESTE DE CURSOS
    document
        .getElementById("btn-courses")
        .addEventListener("click", async () => {

            try {
                const response = await getCourses();

                showResult(
                    "GET /fsa/get/courses",
                    true,
                    response
                );

            } catch (error) {

                showResult(
                    "GET /fsa/get/courses",
                    false,
                    error.message
                );
            }
        });


    // TESTE DE TURMAS
    document
        .getElementById("btn-classes")
        .addEventListener("click", async () => {

            try {
                const response = await getClasses();

                showResult(
                    "GET /fsa/get/clases",
                    true,
                    response
                );

            } catch (error) {

                showResult(
                    "GET /fsa/get/clases",
                    false,
                    error.message
                );
            }
        });


    // TESTE DE LOGIN
    document
        .getElementById("btn-login")
        .addEventListener("click", async () => {

            try {
                const response = await login(
                    "test9@fsa.com.br",
                    "Test9!"
                );

                showResult(
                    "POST /user/login",
                    true,
                    response
                );

            } catch (error) {

                showResult(
                    "POST /user/login",
                    false,
                    error.message
                );
            }
        });


    // TESTE DE USUÁRIO
    document
        .getElementById("btn-user")
        .addEventListener("click", async () => {

            try {
                const response =
                    await getAuthenticatedUser("999999");

                showResult(
                    "GET /user/get/999999",
                    true,
                    response
                );

            } catch (error) {

                showResult(
                    "GET /user/get/999999",
                    false,
                    error.message
                );
            }
        });
</script>
