<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoHora — Escolha sua classe</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../estilos/tokens.css">
    <link rel="icon" href="../../assets/icon512_rounded.png">

    <style>
        /* Só o que é específico desta tela; o resto (cor, botão,
           cartão, cabeçalho) vem de tokens.css. */

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 8px;
        }

        .page-subtitle {
            text-align: center;
            color: var(--muted);
            margin-bottom: 36px;
        }

        .classes-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .class-card {
            width: 240px;
            padding: 20px;
            text-align: center;
        }

        .class-card h2 {
            font-size: 1.15rem;
            margin-bottom: 14px;
        }

        .classe-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: var(--radius-md);
            border: 1px solid var(--line);
            margin-bottom: 14px;
        }

        .class-stats {
            display: grid;
            gap: 6px;
            text-align: left;
            margin-bottom: 16px;
        }

        .class-stats li {
            display: flex;
            align-items: center;
            gap: 8px;
            list-style: none;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .class-stats svg {
            flex-shrink: 0;
        }

        #classe-escolhida {
            text-align: center;
            margin-top: 40px;
            color: var(--muted);
        }
    </style>
</head>

<body>

    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="../../index.html" aria-label="EcoHora, voltar ao painel">
                <img class="brand-mark" src="../../assets/Ca105ad9cfc8580c765101d17bbb2323.webp" width="26" height="26" alt="">
                <span class="brand-name">Eco<span>Hora</span></span>
            </a>
            <nav class="primary-nav" aria-label="Navegação">
                <a class="btn btn-ghost" href="../../index.html">Voltar ao painel</a>
            </nav>
        </div>
    </header>

    <main>
        <h1 class="page-title">Escolha sua classe</h1>
        <p class="page-subtitle">Cada classe entra na sua equipe de 6 contra o Mininu.</p>

        <div class="classes-container" id="classes-container">
            <!-- Cards serão criados aqui -->
        </div>

        <div id="classe-escolhida">Nenhuma classe escolhida</div>
    </main>

    <script>

        // ======================
        // ÍCONES DE STATUS (sem emoji, mesmo estilo dos ícones do painel)
        // ======================
        const ICONES = {
            vida: '<svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M10 17.5 3.5 11c-2-2-2-5.3 0-7.2 1.9-1.8 4.7-1.5 6.5.6 1.8-2.1 4.6-2.4 6.5-.6 2 1.9 2 5.2 0 7.2L10 17.5Z" stroke="var(--danger)" stroke-width="1.4" stroke-linejoin="round"/></svg>',
            defesa: '<svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M10 2.5 16.5 5v5c0 4-2.8 6.7-6.5 8-3.7-1.3-6.5-4-6.5-8V5L10 2.5Z" stroke="var(--green-light)" stroke-width="1.4" stroke-linejoin="round"/></svg>',
            velocidade: '<svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M11 2 4 12h5l-1 6 7-10h-5l1-6Z" stroke="var(--gold)" stroke-width="1.4" stroke-linejoin="round"/></svg>',
            especial: '<svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M10 2 12.2 7.4 18 8 13.6 11.8 15 17.5 10 14.3 5 17.5 6.4 11.8 2 8 7.8 7.4 10 2Z" stroke="var(--warm)" stroke-width="1.4" stroke-linejoin="round"/></svg>'
        };

        // ======================
        // SISTEMA DE CLASSES
        // ======================
        class ClassePersonagem {
            constructor(nome, vida, defesa, velocidade, dano, especial, imagem) {
                this.nome = nome;
                this.vida = vida;
                this.defesa = defesa;
                this.velocidade = velocidade;
                this.dano = dano;
                this.especial = especial;
                this.imagem = imagem;

                // sanguesuga
                this.sanguesugas = 0;
            }
            atacar(alvo){

                let danoFinal =
                    this.dano - alvo.defesa;

                if(danoFinal < 1){
                    danoFinal = 1;
                }

                alvo.vida -= danoFinal;

                console.log(
                    `${this.nome} causou
                    ${danoFinal} dano`
                );

                // habilidade do necromante
                if(this.nome === "Necromante"){

                    alvo.sanguesugas++;

                    console.log(
                        `+1 sanguessuga!
                        Total:
                        ${alvo.sanguesugas}`
                    );
                }

                if(alvo.vida <= 0){
                    alvo.vida = 0;
                }
            }

            aplicarStatus(){

                // dano das sanguessugas
                if(this.sanguesugas > 0){

                    this.vida -=
                    this.sanguesugas;

                    console.log(
                        `${this.nome}
                        sofreu
                        ${this.sanguesugas}
                        dano das
                        sanguessugas`
                    );

                    if(this.vida < 0){
                        this.vida = 0;
                    }
                }
            }
        }
        

        // ======================
        // CLASSES DO JOGO
        // ======================
        const classes = [
            // DEFENSORES
            new ClassePersonagem(
                "Guerreiro",
                8,
                7,
                5,
                5,
                "Berserk", // ganha dano com base na vida perdida
                "imagem/guerreiro.jpg"
            ),

            new ClassePersonagem(
                "Escudeiro",
                10,
                9,
                2,
                3,
                "Muralha", // aumenta a defesa dos aliados
                "imagem/escudeiro.png"
            ),

            new ClassePersonagem(
                "Necromante",
                6,
                3,
                5,
                1,
                "Dos Mortos",  // coloca sanguesugas no alvo, causando dano e se curando
                "imagem/necromante.png"
            ),

            // SUPORTES
            new ClassePersonagem(
                "Clérigo",
                7,
                5,
                8,
                4,
                "Purificação",  // Cura uma grande quantidade de vida de um aliado aleatório
                "imagem/clerigo.png"
            ),

            new ClassePersonagem(
                "Druída",
                7,
                4,
                10,
                2,
                "Florescer",  // aumenta a velocidade de aliados aleatórios
                "imagem/druida.jpg"
            ),

            new ClassePersonagem(
                "Bardo",
                6,
                4,
                12,
                2,
                "Animar a Festa",  //  Aumenta o dano de aliados aleatórios
                "imagem/bardo.png"
            ),

            // ATACANTES
            new ClassePersonagem(
                "Arqueiro",
                6,
                5,
                14,
                6,
                "Sniper",  //  Dispara uma flecha pesada que causa x5 o dano normal, mas com 75% de chance de erro
                "imagem/arqueiro.png"
            ),

            new ClassePersonagem(
                "Ladino",
                5,
                4,
                20,
                8,
                "Apunhalada",  //  20% de chance de deixar o alvo sangrando (perde 2% da vida por segundo, dura 5s)
                "imagem/ladino.jpg"
            ),

            new ClassePersonagem(
                "Mago",
                5,
                5,
                10,
                10,
                "Magia Proíbida",  // Deixa o alvo queimando (toma 5 de dano por segundo, dura 5s)
                "imagem/mago.png"
            )
        ];

        localStorage.setItem(
            "todasClasses",
            JSON.stringify(classes)
        );

        // ======================
        // CRIAR CARDS
        // ======================
        const container = document.getElementById("classes-container");

        classes.forEach(classe => {

            const card = document.createElement("div");

            card.classList.add("card", "class-card");

            card.innerHTML = `
                <img
                    src="${classe.imagem}"
                    alt="${classe.nome}"
                    class="classe-img"
                >

                <h2>${classe.nome}</h2>

                <ul class="class-stats">
                    <li>${ICONES.vida} Vida ${classe.vida}</li>
                    <li>${ICONES.defesa} Defesa ${classe.defesa}</li>
                    <li>${ICONES.velocidade} Velocidade ${classe.velocidade}</li>
                    <li>${ICONES.especial} Especial: ${classe.especial}</li>
                </ul>

                <button class="btn btn-solid-green btn-block" onclick="selecionarClasse('${classe.nome}')">
                    Escolher
                </button>
            `;

            container.appendChild(card);
        });

        // ======================
        // ESCOLHER CLASSE
        // ======================
        function selecionarClasse(nomeClasse){

            const classeSelecionada =
            classes.find(
                classe => classe.nome === nomeClasse
            );

            // salva a ficha inteira
            localStorage.setItem(
                "classeJogador",
                JSON.stringify(classeSelecionada)
            );

            // vai para raid.html
            window.location.href =
            "raid.html";
        }

    </script>

</body>
</html>
